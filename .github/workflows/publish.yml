name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  

jobs:
  website:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Website
        run: |
          npm i
          npm run build
        env:
          GITHUB_REPO: z3prover.github.io
          Z3_BUILD_TAG: "v1.0.1"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          target-folder: 'tutorial'
# need an access token for this          
#          repository-name: z3prover/z3prover.github.io
          clean: false
          force: false
          dry-run: false

          
